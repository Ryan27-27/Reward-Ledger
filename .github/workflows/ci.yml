name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pointwise, POSTGRES_PASSWORD: pointwise, POSTGRES_DB: pointwise_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pointwise" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: server } }
    env: { DATABASE_URL: "postgres://pointwise:pointwise@localhost:5432/pointwise_test" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run build
